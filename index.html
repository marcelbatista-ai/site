<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Dodge — Jogo</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --cyan: #22d3ee;
  --blue: #3b82f6;
  --pink: #f43f5e;
  --yellow: #facc15;
  --bg: #020617;
}

body {
  min-height: 100vh;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
  background:
    radial-gradient(circle at 50% -20%, #164e63, transparent 45%),
    radial-gradient(circle at 10% 90%, #172554, transparent 35%),
    var(--bg);
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: min(1000px, 95vw);
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  gap: 15px;
}

.logo {
  font-size: clamp(28px, 5vw, 48px);
  font-weight: 900;
  letter-spacing: 4px;
  color: var(--cyan);
  text-shadow:
    0 0 10px var(--cyan),
    0 0 30px #0891b2;
}

.best {
  padding: 10px 15px;
  border: 1px solid #155e75;
  border-radius: 12px;
  background: rgba(8, 47, 73, .5);
  color: #bae6fd;
}

.hud {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 10px;
}

.box {
  padding: 10px;
  text-align: center;
  border-radius: 12px;
  border: 1px solid #164e63;
  background: rgba(2, 20, 40, .75);
  backdrop-filter: blur(8px);
}

.box small {
  display: block;
  color: #67e8f9;
  font-size: 11px;
  margin-bottom: 4px;
}

.box strong {
  font-size: 20px;
}

#game {
  position: relative;
  width: 100%;
  height: min(620px, 67vh);
  min-height: 400px;
  overflow: hidden;
  border-radius: 20px;
  border: 2px solid #0891b2;
  background:
    linear-gradient(rgba(34,211,238,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,211,238,.06) 1px, transparent 1px),
    linear-gradient(#020617, #06152c);
  background-size: 45px 45px;
  box-shadow:
    0 0 30px rgba(34,211,238,.18),
    inset 0 0 80px rgba(14,116,144,.18);
}

/* estrelas */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  opacity: .7;
  animation: stars linear infinite;
}

@keyframes stars {
  from {
    transform: translateY(-30px);
  }
  to {
    transform: translateY(700px);
  }
}

/* jogador */
#player {
  position: absolute;
  width: 52px;
  height: 52px;
  z-index: 5;
  transition: transform .08s;
}

#player img {
  width: 100%;
  height: 100%;
  filter:
    drop-shadow(0 0 6px #22d3ee)
    drop-shadow(0 0 18px #0891b2);
}

.player-shield {
  position: absolute;
  inset: -10px;
  border: 3px solid #38bdf8;
  border-radius: 50%;
  box-shadow:
    0 0 10px #38bdf8,
    0 0 30px #2563eb;
  animation: shield 1s infinite;
  display: none;
}

@keyframes shield {
  50% {
    transform: scale(1.15);
    opacity: .5;
  }
}

/* inimigo */
.enemy {
  position: absolute;
  width: 46px;
  height: 46px;
  z-index: 4;
}

.enemy img {
  width: 100%;
  height: 100%;
  filter:
    drop-shadow(0 0 7px #f43f5e)
    drop-shadow(0 0 16px #e11d48);
}

/* moeda */
.coin {
  position: absolute;
  width: 30px;
  height: 30px;
  z-index: 3;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff7ae, #facc15 35%, #ca8a04);
  border: 2px solid #fde68a;
  box-shadow:
    0 0 8px #facc15,
    0 0 25px #eab308;
  animation: coinSpin .7s linear infinite;
}

@keyframes coinSpin {
  50% {
    transform: rotateY(180deg) scale(.8);
  }
}

/* power-up */
.power {
  position: absolute;
  width: 36px;
  height: 36px;
  z-index: 3;
  border-radius: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 22px;
  background: linear-gradient(135deg, #a855f7, #6366f1);
  box-shadow:
    0 0 10px #a855f7,
    0 0 30px #6366f1;
  animation: powerPulse .6s infinite alternate;
}

@keyframes powerPulse {
  to {
    transform: scale(1.2) rotate(8deg);
  }
}

/* texto flutuante */
.float {
  position: absolute;
  z-index: 20;
  color: #facc15;
  font-size: 20px;
  font-weight: bold;
  pointer-events: none;
  animation: floatUp .8s forwards;
}

@keyframes floatUp {
  from {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  to {
    opacity: 0;
    transform: translateY(-60px) scale(1.4);
  }
}

/* partículas */
.particle {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 30;
  animation: particle .7s forwards;
}

@keyframes particle {
  to {
    opacity: 0;
    transform: translate(var(--x), var(--y)) scale(.1);
  }
}

/* menu */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(2, 6, 23, .82);
  backdrop-filter: blur(7px);
}

.modal {
  width: min(460px, 90%);
  text-align: center;
  padding: 35px;
  border-radius: 24px;
  border: 1px solid #0e7490;
  background:
    linear-gradient(145deg, rgba(15,23,42,.97), rgba(8,47,73,.95));
  box-shadow: 0 0 60px rgba(34,211,238,.18);
}

.modal h1 {
  color: var(--cyan);
  font-size: 42px;
  margin-bottom: 12px;
  text-shadow: 0 0 20px var(--cyan);
}

.modal p {
  color: #cbd5e1;
  line-height: 1.7;
  margin-bottom: 22px;
}

button {
  border: 0;
  padding: 14px 28px;
  border-radius: 12px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: linear-gradient(135deg, #0891b2, #2563eb);
  box-shadow: 0 8px 25px rgba(37,99,235,.3);
  transition: .2s;
}

button:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 12px 30px rgba(34,211,238,.4);
}

.tip {
  margin-top: 15px;
  font-size: 13px;
  color: #64748b;
}

.controls {
  display: none;
  margin: 12px auto 0;
  grid-template-columns: repeat(3, 58px);
  gap: 6px;
  justify-content: center;
}

.controls button {
  padding: 13px;
  font-size: 18px;
}

.controls button:first-child {
  grid-column: 2;
}

@media(max-width:700px) {
  .hud {
    grid-template-columns: repeat(2, 1fr);
  }

  .best {
    display: none;
  }

  .controls {
    display: grid;
  }

  #game {
    height: 55vh;
    min-height: 350px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">NEON DODGE</div>
  <div class="best">🏆 Recorde: <b id="best">0</b></div>
</header>

<div class="hud">
  <div class="box">
    <small>PONTOS</small>
    <strong id="score">0</strong>
  </div>

  <div class="box">
    <small>VIDAS</small>
    <strong id="lives">❤️❤️❤️</strong>
  </div>

  <div class="box">
    <small>NÍVEL</small>
    <strong id="level">1</strong>
  </div>

  <div class="box">
    <small>COMBO</small>
    <strong id="combo">x1</strong>
  </div>
</div>

<div id="game">

  <div id="player">
    <div class="player-shield" id="shield"></div>

    <!-- nave criada em SVG -->
    <img alt="Nave do jogador"
      src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop stop-color='%2367e8f9'/%3E%3Cstop offset='1' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M50 5 L72 62 L50 90 L28 62 Z' fill='url(%23g)' stroke='%23cffafe' stroke-width='3'/%3E%3Cpath d='M28 62 L8 82 L35 75 M72 62 L92 82 L65 75' fill='%230891b2' stroke='%2367e8f9' stroke-width='3'/%3E%3Ccircle cx='50' cy='45' r='9' fill='%23fff'/%3E%3C/svg%3E">
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h1 id="title">NEON DODGE</h1>

      <p id="message">
        Controle sua nave, desvie dos inimigos,
        colete moedas e consiga o maior combo possível.
      </p>

      <button id="start">🚀 COMEÇAR</button>

      <div class="tip">
        PC: WASD / Setas<br>
        Celular: controles na tela
      </div>
    </div>
  </div>

</div>

<div class="controls">
  <button data-key="ArrowUp">▲</button>
  <button data-key="ArrowLeft">◀</button>
  <button data-key="ArrowDown">▼</button>
  <button data-key="ArrowRight">▶</button>
</div>

</div>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const overlay = document.getElementById("overlay");
const start = document.getElementById("start");

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const levelEl = document.getElementById("level");
const comboEl = document.getElementById("combo");
const bestEl = document.getElementById("best");

const title = document.getElementById("title");
const message = document.getElementById("message");
const shieldEl = document.getElementById("shield");

let x = 0;
let y = 0;

let score = 0;
let lives = 3;
let level = 1;
let combo = 1;
let best = Number(localStorage.getItem("neonBest")) || 0;

let running = false;
let shield = false;

let enemies = [];
let coins = [];
let powers = [];

let animation;
let enemyTimer;
let coinTimer;
let powerTimer;

const keys = {};

bestEl.textContent = best;

/* =========================
   SOM
========================= */

let audio;

function sound(freq, duration = .08, type = "sine") {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.frequency.value = freq;
    oscillator.type = type;

    gain.gain.setValueAtTime(.06, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + duration);

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.start();
    oscillator.stop(audio.currentTime + duration);
  } catch(e) {}
}

/* =========================
   ESTRELAS
========================= */

for (let i = 0; i < 80; i++) {
  const star = document.createElement("div");

  star.className = "star";

  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.animationDuration = (2 + Math.random() * 5) + "s";
  star.style.animationDelay = (-Math.random() * 5) + "s";

  game.appendChild(star);
}

/* =========================
   PLAYER
========================= */

function resetPlayer() {
  x = game.clientWidth / 2 - 26;
  y = game.clientHeight - 80;

  updatePlayer();
}

function updatePlayer() {
  player.style.left = x + "px";
  player.style.top = y + "px";
}

function movePlayer() {

  const speed = 6;

  if (keys.ArrowUp || keys.w || keys.W) y -= speed;
  if (keys.ArrowDown || keys.s || keys.S) y += speed;
  if (keys.ArrowLeft || keys.a || keys.A) x -= speed;
  if (keys.ArrowRight || keys.d || keys.D) x += speed;

  x = Math.max(0, Math.min(game.clientWidth - 52, x));
  y = Math.max(0, Math.min(game.clientHeight - 52, y));

  player.style.left = x + "px";
  player.style.top = y + "px";
}

/* =========================
   HUD
========================= */

function updateHUD() {
  scoreEl.textContent = Math.floor(score);
  livesEl.textContent =
    "❤️".repeat(lives) +
    "🖤".repeat(Math.max(0, 3 - lives));

  levelEl.textContent = level;
  comboEl.textContent = "x" + combo;
}

/* =========================
   INIMIGOS
========================= */

const enemySVG =
"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 5 L95 50 L50 95 L5 50 Z' fill='%23e11d48' stroke='%23fda4af' stroke-width='4'/%3E%3Ccircle cx='50' cy='50' r='17' fill='%230f172a' stroke='%23fb7185' stroke-width='5'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%23fff'/%3E%3C/svg%3E";

function createEnemy() {

  if (!running) return;

  const enemy = document.createElement("div");
  enemy.className = "enemy";

  const img = document.createElement("img");
  img.src = enemySVG;

  enemy.appendChild(img);

  enemy.x = Math.random() * (game.clientWidth - 46);
  enemy.y = -60;

  enemy.speed = 2 + Math.random() * 2 + level * .3;

  enemy.style.left = enemy.x + "px";
  enemy.style.top = enemy.y + "px";

  game.appendChild(enemy);

  enemies.push(enemy);
}

/* =========================
   MOEDAS
========================= */

function createCoin() {

  if (!running) return;

  const coin = document.createElement("div");

  coin.className = "coin";

  coin.x = Math.random() * (game.clientWidth - 30);
  coin.y = -40;

  coin.speed = 2.5 + level * .15;

  coin.style.left = coin.x + "px";
  coin.style.top = coin.y + "px";

  game.appendChild(coin);

  coins.push(coin);
}

/* =========================
   POWER UP
========================= */

function createPower() {

  if (!running) return;

  const power = document.createElement("div");

  power.className = "power";
  power.textContent = "🛡️";

  power.x = Math.random() * (game.clientWidth - 36);
  power.y = -50;

  power.speed = 2;

  power.style.left = power.x + "px";
  power.style.top = power.y + "px";

  game.appendChild(power);

  powers.push(power);
}

/* =========================
   COLISÃO
========================= */

function collision(a, b) {

  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );
}

/* =========================
   PARTÍCULAS
========================= */

function particles(px, py, color = "#22d3ee") {

  for (let i = 0; i < 15; i++) {

    const p = document.createElement("div");

    p.className = "particle";

    p.style.background = color;
    p.style.left = px + "px";
    p.style.top = py + "px";

    p.style.setProperty(
      "--x",
      (Math.random() * 120 - 60) + "px"
    );

    p.style.setProperty(
      "--y",
      (Math.random() * 120 - 60) + "px"
    );

    game.appendChild(p);

    setTimeout(() => p.remove(), 700);
  }
}

/* =========================
   TEXTO FLUTUANTE
========================= */

function floatingText(text, px, py) {

  const el = document.createElement("div");

  el.className = "float";
  el.textContent = text;

  el.style.left = px + "px";
  el.style.top = py + "px";

  game.appendChild(el);

  setTimeout(() => el.remove(), 800);
}

/* =========================
   MOEDAS / POWERUPS
========================= */

function moveCoins() {

  const playerRect = {
    x,
    y,
    width: 52,
    height: 52
  };

  coins.forEach((coin, i) => {

    coin.y += coin.speed;
    coin.style.top = coin.y + "px";

    const rect = {
      x: coin.x,
      y: coin.y,
      width: 30,
      height: 30
    };

    if (collision(playerRect, rect)) {

      score += 150 * combo;

      combo++;

      if (combo > 10) combo = 10;

      floatingText(
        "+" + (150 * combo),
        coin.x,
        coin.y
      );

      particles(coin.x, coin.y, "#facc15");

      sound(880, .08);

      coin.remove();
      coins.splice(i, 1);

      updateHUD();
    }

    if (coin.y > game.clientHeight + 50) {

      coin.remove();
      coins.splice(i, 1);
    }
  });
}

function movePowers() {

  const playerRect = {
    x,
    y,
    width: 52,
    height: 52
  };

  powers.forEach((power, i) => {

    power.y += power.speed;
    power.style.top = power.y + "px";

    const rect = {
      x: power.x,
      y: power.y,
      width: 36,
      height: 36
    };

    if (collision(playerRect, rect)) {

      shield = true;
      shieldEl.style.display = "block";

      floatingText("🛡️ ESCUDO!", power.x, power.y);

      sound(500, .2, "square");

      power.remove();
      powers.splice(i, 1);

      setTimeout(() => {

        shield = false;
        shield
